mainSections   = ["post"]
rssFullContent = true

[footer]
    since = 2026

[sidebar]
    avatar   = "img/avatar.png"

[article]
    [article.license]
        enabled = true
        default = "Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit =  10 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page     = [{ type = "toc" }]

[comments]
    enabled  = true
    provider = "waline"

[comments.waline]
    serverURL    = "https://waline-on-worker.huangjinyangyang.workers.dev/"
    lang         = "zh-CN"
    emoji        = ['https://app.unpkg.com/@waline/emojis@1.1.0/files/bmoji']
    meta         = ['nick', 'mail']
    requiredMeta = ['nick']
    placeholder  = "发表你的想法："

[cookies]
    enabled = false

    [cookies.categories]
        analytics  = true
        functional = true

[dateFormat]
    published = '2006-01-02'
    lastUpdated = '2006-01-02 15:04:05 MST'
